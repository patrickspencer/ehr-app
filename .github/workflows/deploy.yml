name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/patrickspencer/ehr-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push backend
        run: |
          docker build \
            -t $REGISTRY/backend:latest \
            -t $REGISTRY/backend:${{ github.sha }} \
            ./backend
          docker push $REGISTRY/backend:latest
          docker push $REGISTRY/backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build \
            -t $REGISTRY/frontend:latest \
            -t $REGISTRY/frontend:${{ github.sha }} \
            ./frontend
          docker push $REGISTRY/frontend:latest
          docker push $REGISTRY/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: <DEPLOY_HOST>
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_PAT
          script: |
            echo "$GH_PAT" | docker login ghcr.io -u patrickspencer --password-stdin
            cd /opt/ehr-app
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
