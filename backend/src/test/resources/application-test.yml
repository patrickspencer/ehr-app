spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ehr?currentSchema=ehr_test
    username: ehr
    password: ehr
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ehr_test
  flyway:
    enabled: true
    default-schema: ehr_test
    schemas: ehr_test
    create-schemas: true

fhir:
  server:
    url: http://localhost:8092/fhir

server:
  port: 0
  error:
    include-message: always
